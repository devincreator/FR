name: FR 研究复盘反馈
description: 提交研究纠错，经自动化处理后生成规则更新 PR
title: '[FR feedback] '
labels:
  - fr-feedback
body:
  - type: markdown
    attributes:
      value: |
        只提交抽象的研究规则。请勿提交原始聊天、完整会议纪要、客户信息或保密附件。
  - type: textarea
    id: feedback
    attributes:
      label: 结构化反馈 JSON
      description: 复制 templates/feedback.json 并填写单个 JSON 对象
      render: json
    validations:
      required: true
