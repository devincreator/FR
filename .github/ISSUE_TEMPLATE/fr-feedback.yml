name: FR 研究复盘反馈
description: 提交可泛化纠错；标题触发自动候选更新，不上传完整聊天
# A repository with no custom labels can still submit this form.
title: '[FR feedback] '
body:
  - type: markdown
    attributes:
      value: |
        请只提交可复用规则的结构化摘要。不得包含完整聊天、客户名称、非公开研究或未经授权资料。
  - type: textarea
    id: feedback
    attributes:
      label: 结构化反馈 JSON
      description: 按 templates/feedback.json 结构填写单个 JSON 对象
      render: json
    validations:
      required: true
