name: bootstrap test
on:
  push:
    paths:
      - '.github/workflows/bootstrap.yml'
permissions:
  contents: write
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Test write
        run: |
          echo '# Connection verified' > .fr-action-test.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .fr-action-test.txt
          git commit -m 'ci: verify write access'
          git push
