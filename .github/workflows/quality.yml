name: FR quality checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Validate structure
        run: python scripts/verify_skill.py
      - name: Run tests
        run: python -m unittest discover -s tests -v
